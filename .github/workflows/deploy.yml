name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, gsbot-ec2]
    defaults:
      run:
        shell: bash
    steps:
      - name: 코드 동기화 및 PM2 reload
        run: |
          set -euo pipefail
          export NVM_DIR="$HOME/.nvm"
          # shellcheck disable=SC1091
          . "$NVM_DIR/nvm.sh"

          cd "$HOME/gsbot_server"
          git fetch --prune origin main
          git reset --hard origin/main

          pm2 reload gsbot_server --update-env
          pm2 save
